<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workplace Login</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
:root{
  --bg:#f3f4f7; --panel:#ffffff; --soft:#f6f7f9; --text:#111827; --muted:#6b7280; --line:#eceef2;
  --primary:#1f5fd6; --primary-soft:#e8f0fe; --accent:#f58a5b; --accent-soft:#fff1ea;
  --green:#16a34a; --green-soft:#eafaf0; --red:#dc2626; --red-soft:#fef2f2;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 12px 28px rgba(0,0,0,.08);
}
[data-theme="dark"]{
  --bg:#0d1117; --panel:#161b22; --soft:#1c2330; --text:#e6edf3; --muted:#8b98a9; --line:#262e3b;
  --primary:#4c8dff; --primary-soft:#172640; --accent:#ff9d73; --accent-soft:#3a2418;
  --green:#3fb950; --green-soft:#12301c; --red:#f85149; --red-soft:#3b1618;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI',Inter,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  position:relative;
}
.theme-toggle{
  position:absolute;
  top:20px;
  right:20px;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--muted);
  width:40px;
  height:40px;
  border-radius:10px;
  display:grid;
  place-items:center;
  cursor:pointer;
  transition:.15s;
}
.theme-toggle:hover{color:var(--text);background:var(--soft)}

.login-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:var(--shadow);
  width:100%;
  max-width:440px;
  padding:36px 32px;
  animation:pop .25s ease-out;
}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

.brand{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  margin-bottom:28px;
}
.brand-logo{
  width:52px;
  height:52px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--primary),#60a5fa);
  color:#fff;
  display:grid;
  place-items:center;
  font-size:24px;
  font-weight:800;
  box-shadow:0 8px 16px rgba(31,95,214,.25);
  margin-bottom:14px;
}
.brand h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.brand p{color:var(--muted);font-size:13.5px;margin-top:4px}

.alert{
  padding:11px 14px;
  border-radius:10px;
  font-size:13px;
  font-weight:500;
  margin-bottom:20px;
  display:none;
}
.alert.error{display:block;background:var(--red-soft);color:var(--red);border:1px solid var(--red-soft)}
.alert.success{display:block;background:var(--green-soft);color:var(--green);border:1px solid var(--green-soft)}

.form-group{margin-bottom:18px}
.form-group label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
  color:var(--text);
}
.input-wrap{position:relative}
.input-wrap input{
  width:100%;
  padding:12px 14px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  border-radius:10px;
  font-size:14px;
  font-family:inherit;
  transition:.15s;
}
.input-wrap input:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft);
}
.pwd-toggle{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  color:var(--muted);
  font-size:16px;
  cursor:pointer;
  padding:4px;
}
.pwd-toggle:hover{color:var(--text)}

.btn-submit{
  width:100%;
  padding:12px;
  background:var(--primary);
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:14.5px;
  font-weight:600;
  cursor:pointer;
  transition:.15s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:10px;
}
.btn-submit:hover{filter:brightness(1.08)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed}

/* Role Selector Segmented Tabs */
.role-selector-wrap{margin-bottom:20px}
.role-label{
  display:block;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--muted);
  margin-bottom:8px;
}
.role-pills{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:6px;
  background:var(--soft);
  padding:5px;
  border-radius:12px;
  border:1px solid var(--line);
}
.role-pill{
  background:transparent;
  border:1px solid transparent;
  color:var(--muted);
  padding:9px 6px;
  border-radius:8px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:all .16s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-family:inherit;
  outline:none;
}
.role-pill:hover{
  color:var(--text);
  background:rgba(0,0,0,.03);
}
[data-theme="dark"] .role-pill:hover{
  background:rgba(255,255,255,.05);
}
.role-pill.active{
  background:var(--panel);
  color:var(--primary);
  border-color:var(--line);
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}
[data-theme="dark"] .role-pill.active{
  background:#21262d;
  color:var(--primary);
  border-color:#30363d;
  box-shadow:0 2px 8px rgba(0,0,0,.35);
}
.role-pill .role-icon{font-size:14px}

/* Mobile Responsive */
@media(max-width:480px){
  body{padding:14px}
  .login-card{padding:24px 18px;border-radius:16px}
  .brand-logo{width:44px;height:44px;font-size:20px;margin-bottom:10px}
  .brand h1{font-size:20px}
  .brand p{font-size:12.5px}
  .role-pills{padding:4px}
  .role-pill{padding:8px 4px;font-size:12px;gap:4px}
  .theme-toggle{top:12px;right:12px;width:36px;height:36px}
}
</style>
</head>
<body>

<button class="theme-toggle" id="themeBtn" title="Toggle Theme" aria-label="Toggle Theme">🌓</button>

<div class="login-card">
  <div class="brand">
    <div class="brand-logo">E</div>
    <h1>Workplace Portal</h1>
    <p>Sign in with your role or employee credentials</p>
  </div>

  <div id="alertBox" class="alert"></div>

  <!-- Role Selector (Admin, HR, Employee) -->
  <div class="role-selector-wrap">
    <span class="role-label">Select Your Role</span>
    <div class="role-pills" role="radiogroup" aria-label="Select Role">
      <button type="button" class="role-pill" data-role="admin" id="roleBtnAdmin" onclick="selectRole('admin')">
        <span class="role-icon">🛡️</span>
        <span>Admin</span>
      </button>
      <button type="button" class="role-pill" data-role="hr" id="roleBtnHr" onclick="selectRole('hr')">
        <span class="role-icon">👔</span>
        <span>HR</span>
      </button>
      <button type="button" class="role-pill active" data-role="employee" id="roleBtnEmployee" onclick="selectRole('employee')">
        <span class="role-icon">👤</span>
        <span>Employee</span>
      </button>
    </div>
    <input type="hidden" id="selectedRole" value="employee" />
  </div>

  <form id="loginForm" novalidate>
    <div class="form-group">
      <label for="emailOrUsername" id="emailLabel">Email Address</label>
      <div class="input-wrap">
        <input type="text" id="emailOrUsername" placeholder="e.g. devaghanekar@gmail.com" required autocomplete="email" />
      </div>
    </div>

    <div class="form-group">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <label for="password" style="margin-bottom:0">Password</label>
        <a href="javascript:void(0)" onclick="openForgotPwd()" style="font-size:12px;color:var(--primary);text-decoration:none;font-weight:600">Forgot password?</a>
      </div>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="Enter password (any password)" required autocomplete="current-password" />
        <button type="button" class="pwd-toggle" id="pwdToggle" title="Show/Hide Password">👁️</button>
      </div>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">
      <span>Sign In</span>
    </button>
  </form>

  <div style="text-align:center;font-size:11.5px;color:var(--muted);margin-top:16px">
    Select role, then enter your email address and any password to sign in.
  </div>
</div>

<!-- Modal: Forgot Password -->
<div class="modal-overlay" id="forgotPwdModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:16px">
  <div class="login-card" style="max-width:390px;position:relative">
    <button type="button" onclick="closeForgotPwd()" style="position:absolute;top:16px;right:16px;background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer">&times;</button>
    <div style="text-align:center;margin-bottom:18px">
      <div style="width:46px;height:46px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:22px;margin:0 auto 10px">🔑</div>
      <h3 style="font-size:18px;font-weight:700">Forgot Password?</h3>
      <p style="color:var(--muted);font-size:12.5px;margin-top:4px">Enter your registered email address to receive password reset instructions.</p>
    </div>
    <div id="forgotAlert" class="alert"></div>
    <form id="forgotForm" onsubmit="handleForgotSubmit(event)">
      <div class="form-group">
        <label for="forgotEmail">Email Address</label>
        <div class="input-wrap">
          <input type="email" id="forgotEmail" placeholder="e.g. employee@company.com" required />
        </div>
      </div>
      <button type="submit" class="btn-submit" id="btnForgotSubmit" style="margin-top:6px">
        <span>Send Instructions</span>
      </button>
      <div style="text-align:center;margin-top:14px">
        <a href="javascript:void(0)" onclick="closeForgotPwd()" style="font-size:12.5px;color:var(--muted);text-decoration:none">Back to Login</a>
      </div>
    </form>
  </div>
</div>

<script>
// Theme Management
const savedTheme = localStorage.getItem('edm_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
document.documentElement.dataset.theme = savedTheme;
document.getElementById('themeBtn').addEventListener('click', () => {
  const current = document.documentElement.dataset.theme;
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('edm_theme', next);
});

// Show / Hide Password
const pwdInput = document.getElementById('password');
const pwdToggle = document.getElementById('pwdToggle');
pwdToggle.addEventListener('click', () => {
  const isPass = pwdInput.type === 'password';
  pwdInput.type = isPass ? 'text' : 'password';
  pwdToggle.textContent = isPass ? '🔒' : '👁️';
});

// Role Selection Switcher
let currentRole = 'employee';
function selectRole(role) {
  currentRole = role;
  const roleInput = document.getElementById('selectedRole');
  if (roleInput) roleInput.value = role;

  ['admin', 'hr', 'employee'].forEach(r => {
    const btn = document.getElementById('roleBtn' + r.charAt(0).toUpperCase() + r.slice(1));
    if (btn) btn.classList.toggle('active', r === role);
  });

  const emailInput = document.getElementById('emailOrUsername');
  if (emailInput) {
    if (role === 'admin') {
      emailInput.placeholder = 'e.g. admin@company.com or your email';
    } else if (role === 'hr') {
      emailInput.placeholder = 'e.g. hr@company.com or your email';
    } else {
      emailInput.placeholder = 'e.g. devaghanekar@gmail.com';
    }
  }

  const alertBox = document.getElementById('alertBox');
  if (alertBox) alertBox.className = 'alert';
}

// Forgot Password Modal
function openForgotPwd() {
  document.getElementById('forgotAlert').className = 'alert';
  document.getElementById('forgotEmail').value = '';
  document.getElementById('forgotPwdModal').style.display = 'flex';
  document.getElementById('forgotEmail').focus();
}
function closeForgotPwd() {
  document.getElementById('forgotPwdModal').style.display = 'none';
}
async function handleForgotSubmit(e) {
  e.preventDefault();
  const alert = document.getElementById('forgotAlert');
  const btn = document.getElementById('btnForgotSubmit');
  const email = document.getElementById('forgotEmail').value.trim();

  if (!email) return;
  btn.disabled = true;
  btn.innerHTML = 'Sending...';
  alert.className = 'alert';

  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    alert.textContent = data.message;
    alert.className = 'alert success';
  } catch (err) {
    alert.textContent = 'Unable to send instructions. Please contact HR.';
    alert.className = 'alert error';
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Send Instructions';
  }
}

// Login Form Submit
const form = document.getElementById('loginForm');
const alertBox = document.getElementById('alertBox');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  alertBox.className = 'alert';
  const emailOrUsername = document.getElementById('emailOrUsername').value.trim();
  const password = document.getElementById('password').value;

  if (!emailOrUsername) {
    alertBox.textContent = 'Please enter your email address.';
    alertBox.className = 'alert error';
    document.getElementById('emailOrUsername').focus();
    return;
  }

  // Validate that email looks like a valid email ("email email jaisa hona chahiye")
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const isEmpCode = /^[a-zA-Z0-9_\-\.]+$/.test(emailOrUsername) && !emailOrUsername.includes('@');
  if (!emailRegex.test(emailOrUsername) && !isEmpCode) {
    alertBox.textContent = 'Please enter a valid email address (e.g. devaghanekar@gmail.com).';
    alertBox.className = 'alert error';
    document.getElementById('emailOrUsername').focus();
    return;
  }

  if (!password) {
    alertBox.textContent = 'Please enter your password.';
    alertBox.className = 'alert error';
    document.getElementById('password').focus();
    return;
  }

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span>Signing in...</span>';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        emailOrUsername,
        password,
        role: currentRole
      })
    });
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.message || 'Login failed.');
    }

    // Save token & user profile locally
    localStorage.setItem('auth_token', data.token);
    localStorage.setItem('current_user', JSON.stringify(data.user));

    const roleName = data.user.role === 'admin' ? 'Admin' : (data.user.role === 'hr' ? 'HR' : 'Employee');
    alertBox.textContent = `Login successful as ${roleName}! Redirecting...`;
    alertBox.className = 'alert success';

    setTimeout(() => {
      if (data.user.role === 'employee') {
        window.location.href = '/portal';
      } else {
        window.location.href = '/dashboard';
      }
    }, 350);
  } catch (err) {
    alertBox.textContent = err.message;
    alertBox.className = 'alert error';
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<span>Sign In</span>';
  }
});
</script>
</body>
</html>
