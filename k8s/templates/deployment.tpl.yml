apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-app-__COLOR__
  namespace: employee-app
  labels:
    app: employee-app
    version: __COLOR__
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: employee-app
      version: __COLOR__
  template:
    metadata:
      labels:
        app: employee-app
        version: __COLOR__
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql-service 3306; do echo waiting for mysql...; sleep 3; done"]
        - name: init-volume
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /vol/data /vol/uploads/avatars && chown -R 1000:1000 /vol"]
          volumeMounts:
            - name: app-storage
              mountPath: /vol
      containers:
        - name: employee-app
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: employee-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: employee-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: app-storage
              mountPath: /app/data
              subPath: data
            - name: app-storage
              mountPath: /app/public/uploads
              subPath: uploads
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: employee-app-pvc
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: employee-app-hpa-__COLOR__
  namespace: employee-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: employee-app-__COLOR__
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60