apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-app
  namespace: employee-app
  labels:
    app: employee-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-app
  template:
    metadata:
      labels:
        app: employee-app
    spec:
      initContainers:
        # 1) MySQL ready hone tak wait karo
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql-service 3306; do echo waiting for mysql...; sleep 3; done"]
        # 2) Volume me folders banao + permission do (app 'node' user uid 1000 se chalta hai)
        - name: init-volume
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /vol/data /vol/uploads/avatars && chown -R 1000:1000 /vol"]
          volumeMounts:
            - name: app-storage
              mountPath: /vol
      containers:
        - name: employee-app
          image: employee-management-app:latest
          imagePullPolicy: IfNotPresent     # minikube local image ke liye
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: employee-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: employee-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: app-storage
              mountPath: /app/data
              subPath: data
            - name: app-storage
              mountPath: /app/public/uploads
              subPath: uploads
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: employee-app-pvc
